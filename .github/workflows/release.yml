name: Release

# Solo-owner release pipeline.
#
# Triggered ONLY by a pushed annotated `v*` tag. A pull request or an ordinary
# branch push can never reach any job here, so no write or OIDC job is reachable
# from an untrusted event.
#
# Privilege separation (each job declares its own least-privilege block):
#   release-build    contents: read
#   release-attest   contents: read + id-token: write + attestations: write
#   release-draft    contents: write
#   release-publish  contents: write
# `id-token`/`attestations` are NEVER co-located with `contents: write`, and the
# release-write jobs never request OIDC. The top-level `permissions: {}` denies
# every scope by default.
#
# This repository has a single maintainer, so a pushed `v*` tag publishes the
# GitHub Release with no second GitHub account, no environment reviewer, and no
# fine-grained settings-read token. The pipeline references NO repository or
# environment secret: every API call runs on the workflow's automatic
# `${{ github.token }}` (contents: read) and the publish mutation on the same
# automatic token with contents: write. The `release` environment is not
# attached to the publish job.
#
# No third-party release action is used: the draft and the publish mutation go
# through the pinned GitHub CLI using the workflow's automatic token.
#
# Publication is impossible unless the following hold at the tagged commit:
# docs/release-state.json is schema v2 with `stable: true` and every
# pre-publication owner gate populated while `publication.tagAndRelease` is
# still false. The GitHub-side protections (immutable releases enabled and an
# active no-bypass tag ruleset for `refs/tags/v*`) remain in force; publication
# never weakens them, and the post-publish verification still refuses to report
# success on a mutable release or a retargeted tag.
#
# The publish job proves the complete public draft asset set is exactly the two
# user-installable names (both as downloaded and as reported by the API), re-fetches the
# draft immediately before the single mutation and rejects any changed release
# id, tag, draft state or asset id/name/size/digest, then re-resolves the tag
# target after publication. A retargeted tag is a publication incident and is
# never reported as success.

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_BRANCH: release/public-1.0.0
  GH_REPO: ${{ github.repository }}

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      run-id: ${{ github.run_id }}
      source-sha: ${{ steps.source.outputs.commit }}
      source-tree: ${{ steps.source.outputs.tree }}
      source-tag: ${{ steps.source.outputs.tag }}
      release-manifest-sha256: ${{ steps.prepare.outputs.release-manifest-sha256 }}
      sums-sha256: ${{ steps.prepare.outputs.sums-sha256 }}
    steps:
      - name: Checkout the exact tag with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Fetch the release branch for ancestry validation
        run: git fetch --no-tags origin "+refs/heads/${RELEASE_BRANCH}:refs/remotes/origin/${RELEASE_BRANCH}"

      - name: Install locked dependencies
        run: npm ci

      - name: Verify annotated exact-version tag, ancestry and release state
        id: source
        env:
          RELEASE_STATE_PATH: docs/release-state.json
        run: |
          node --input-type=commonjs - <<'NODE'
            'use strict';
            const fs = require('node:fs');
            const { spawnSync } = require('node:child_process');
            function fail(code, message) {
              console.error(`RELEASE BUILD FAIL: ${code}: ${message}`);
              process.exit(1);
            }
            function git(args) {
              const result = spawnSync('git', args, { encoding: 'utf8' });
              if (result.status !== 0) throw new Error(`git ${args.join(' ')} failed`);
              return String(result.stdout || '').trim();
            }
            const ref = process.env.GITHUB_REF || '';
            if (!ref.startsWith('refs/tags/v')) fail('tag-not-vstar', `workflow must run from a v* tag, got ${ref}`);
            const tag = ref.slice('refs/tags/'.length);
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const expectedTag = `v${pkg.version}`;
            if (tag !== expectedTag) fail('tag-version-mismatch', `${tag} does not match ${expectedTag}`);
            let tagType = '';
            try {
              tagType = git(['cat-file', '-t', `refs/tags/${tag}`]);
            } catch {
              fail('tag-missing', `annotated tag ${tag} is missing`);
            }
            if (tagType !== 'tag') fail('tag-not-annotated', `tag ${tag} must be an annotated tag`);
            const taggedCommit = git(['rev-parse', `refs/tags/${tag}^{commit}`]);
            const head = git(['rev-parse', 'HEAD']);
            if (head !== taggedCommit) fail('checkout-not-tagged-commit', `HEAD ${head} is not ${taggedCommit}`);
            const tree = git(['rev-parse', `${taggedCommit}^{tree}`]);
            const releaseBranch = process.env.RELEASE_BRANCH;
            const ancestry = spawnSync('git', ['merge-base', '--is-ancestor', taggedCommit, `origin/${releaseBranch}`], { encoding: 'utf8' });
            if (ancestry.status !== 0) fail('tag-off-release-branch', `tagged commit is not contained in ${releaseBranch}`);
            const state = JSON.parse(fs.readFileSync(process.env.RELEASE_STATE_PATH, 'utf8'));
            if (state.schemaVersion !== 2) fail('release-state-schema', 'release-state must be schema v2');
            if (state.version !== pkg.version) fail('release-state-version', 'release-state version does not match package.json');
            if (state.stable !== true) fail('release-state-not-stable', 'stable must be true before a release tag can build');
            if (state.publication.tagAndRelease !== false) fail('release-state-tag-and-release', 'publication.tagAndRelease must still be false before publication');
            const gates = ['pilotInstallBySecondPerson', 'evidenceRecord', 'branchProtection', 'devArchival', 'releaseEnvironment', 'immutableReleases'];
            for (const gate of gates) {
              const value = state.ownerManual ? state.ownerManual[gate] : undefined;
              if (value === undefined || value === null || value === false || value === '') fail('release-state-owner-gate', `pre-publication owner gate ${gate} is not populated`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${taggedCommit}\ntree=${tree}\ntag=${tag}\n`);
            console.log(`RELEASE BUILD TAG OK: ${tag} -> ${taggedCommit}`);
          NODE

      - name: Deterministic build
        run: npm run build

      - name: Full release gates
        run: |
          npm run check:versions
          npm test
          npm run check
          npm run check:types
          npm run quality

      - name: Deterministic release preparation and verification
        id: prepare
        run: |
          npm run release:prepare -- --out release --json
          npm run release:check -- --dir release --json
          echo "release-manifest-sha256=$(sha256sum release/release-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sums-sha256=$(sha256sum release/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the exact release directory
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 30

  release-attest:
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      attestation-id: ${{ steps.attest.outputs.attestation-id }}
      bundle-path: ${{ steps.attest.outputs.bundle-path }}
    steps:
      - name: Download the immutable release artifact by captured id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact-id }}
          run-id: ${{ needs.release-build.outputs.run-id }}
          path: release
          merge-multiple: true

      - name: Recompute the release digests from the downloaded artifact
        run: |
          cd release
          sha256sum -c SHA256SUMS
          test "$(sha256sum release-manifest.json | cut -d' ' -f1)" = "${{ needs.release-build.outputs.release-manifest-sha256 }}"
          test "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "${{ needs.release-build.outputs.sums-sha256 }}"

      - name: Attest every release subject
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

  release-draft:
    needs: [release-build, release-attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - name: Download the exact release artifact by captured id
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact-id }}
          run-id: ${{ needs.release-build.outputs.run-id }}
          path: release
          merge-multiple: true

      - name: Recheck artifact digest, manifest source and checksums
        run: |
          cd release
          sha256sum -c SHA256SUMS
          test "$(sha256sum release-manifest.json | cut -d' ' -f1)" = "${{ needs.release-build.outputs.release-manifest-sha256 }}"
          node -e "const m=require('./release-manifest.json'); if(m.source.commit!=='${{ needs.release-build.outputs.source-sha }}'||m.source.tree!=='${{ needs.release-build.outputs.source-tree }}') process.exit(1);"

      - name: Create exactly one draft release (idempotent per tag)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
        run: |
          set -euo pipefail
          TITLE="Travian Attack Alert ${TAG}"
          ASSETS=(release/travian-attack-alert.user.js release/travian-attack-alert.user.js.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json isDraft,tagName,assets > existing-release.json
            node -e "
              const release = require('./existing-release.json');
              const expected = ['travian-attack-alert.user.js','travian-attack-alert.user.js.sha256'];
              if (release.isDraft !== true) { console.error('RELEASE DRAFT FAIL: existing release is already published'); process.exit(1); }
              const names = release.assets.map((asset) => asset.name).sort();
              if (JSON.stringify(names) !== JSON.stringify([...expected].sort())) { console.error('RELEASE DRAFT FAIL: existing draft asset set is mismatched'); process.exit(1); }
              console.log('RELEASE DRAFT IDEMPOTENT: exact draft already exists');
            "
          else
            gh release create "$TAG" --draft --verify-tag --title "$TITLE" --generate-notes "${ASSETS[@]}"
          fi
          gh release view "$TAG" --json id,databaseId,tagName,isDraft,assets > draft-release.json
          echo "release-id=$(node -e "console.log(require('./draft-release.json').databaseId)")" >> "$GITHUB_OUTPUT"

  release-publish:
    needs: [release-build, release-attest, release-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Verify the tag still targets the exact release commit
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
          SOURCE_SHA: ${{ needs.release-build.outputs.source-sha }}
        run: |
          set -euo pipefail
          tag_object=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          tag_commit=$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')
          test "$tag_commit" = "$SOURCE_SHA" || { echo "RELEASE PREFLIGHT FAIL: tag-target-mismatch: $TAG now points at $tag_commit, expected $SOURCE_SHA"; exit 1; }
          echo "RELEASE PREFLIGHT PASS: $TAG targets $SOURCE_SHA"

      - name: Download the captured workflow artifact into a fresh directory
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact-id }}
          run-id: ${{ needs.release-build.outputs.run-id }}
          path: preflight/workflow-artifact
          merge-multiple: true

      - name: Download every remote draft asset into a separate fresh directory
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
        run: |
          set -euo pipefail
          mkdir -p preflight/draft-assets
          gh api "repos/$REPO/releases/$RELEASE_ID" > preflight/release-listed.json
          gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate --jq '.[] | [.id, .name] | @tsv' > preflight/asset-ids.tsv
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api "repos/$REPO/releases/assets/$asset_id" -H "Accept: application/octet-stream" > "preflight/draft-assets/$asset_name"
          done < preflight/asset-ids.tsv
          node -e "
            const fs = require('fs');
            const expected = ['travian-attack-alert.user.js','travian-attack-alert.user.js.sha256'].sort();
            const release = JSON.parse(fs.readFileSync('preflight/release-listed.json', 'utf8'));
            function fail(message) { console.error('RELEASE PUBLISH FAIL: draft-asset-set-mismatch: ' + message); process.exit(1); }
            if (release.draft !== true) fail('target release is not a draft');
            const apiNames = release.assets.map((asset) => asset.name);
            if (new Set(apiNames).size !== apiNames.length) fail('the API-reported draft contains duplicate asset names');
            if (JSON.stringify([...apiNames].sort()) !== JSON.stringify(expected)) fail('the API-reported draft asset set is not exactly the two declared assets');
            const downloaded = fs.readdirSync('preflight/draft-assets').sort();
            if (new Set(downloaded).size !== downloaded.length) fail('the downloaded asset directory contains duplicate names');
            if (JSON.stringify(downloaded) !== JSON.stringify(expected)) fail('the downloaded asset set is not exactly the two declared assets');
            const crypto = require('crypto');
            for (const asset of release.assets) {
              const bytes = fs.readFileSync('preflight/draft-assets/' + asset.name);
              const digest = 'sha256:' + crypto.createHash('sha256').update(bytes).digest('hex');
              if (asset.digest !== digest) fail('downloaded bytes do not match the API digest for ' + asset.name);
              if (asset.size !== bytes.length) fail('downloaded size does not match the API size for ' + asset.name);
            }
            console.log('RELEASE PUBLISH DRAFT SET OK: exactly two declared assets');
          "

      - name: Reverify byte identity, checksums, tag target and attestations
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
          SOURCE_SHA: ${{ needs.release-build.outputs.source-sha }}
          SOURCE_TREE: ${{ needs.release-build.outputs.source-tree }}
        run: |
          set -euo pipefail
          for name in travian-attack-alert.user.js travian-attack-alert.user.js.sha256; do
            cmp -s "preflight/workflow-artifact/$name" "preflight/draft-assets/$name" || { echo "RELEASE PUBLISH FAIL: asset-artifact mismatch for $name"; exit 1; }
          done
          ( cd preflight/workflow-artifact && sha256sum -c SHA256SUMS )
          node -e "const m=require('./preflight/workflow-artifact/release-manifest.json'); if(m.source.commit!==process.env.SOURCE_SHA||m.source.tree!==process.env.SOURCE_TREE) process.exit(1);"
          tag_object=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          tag_commit=$(gh api "repos/$REPO/git/tags/$tag_object" --jq '.object.sha')
          test "$tag_commit" = "$SOURCE_SHA"
          for name in travian-attack-alert.user.js travian-attack-alert.user.js.sha256; do
            gh attestation verify "preflight/workflow-artifact/$name" -R "$REPO" >/dev/null || { echo "RELEASE PUBLISH FAIL: attestation verification failed for $name"; exit 1; }
          done

      - name: Record immutable pre-publish evidence
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
          RUN_ID: ${{ needs.release-build.outputs.run-id }}
          ARTIFACT_ID: ${{ needs.release-build.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ needs.release-build.outputs.artifact-digest }}
          ATTESTATION_ID: ${{ needs.release-attest.outputs.attestation-id }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" > preflight/release-before.json
          node -e "
            const fs = require('fs');
            const release = JSON.parse(fs.readFileSync('preflight/release-before.json', 'utf8'));
            const listed = JSON.parse(fs.readFileSync('preflight/release-listed.json', 'utf8'));
            if (release.draft !== true) { console.error('RELEASE PUBLISH FAIL: target release is not a draft'); process.exit(1); }
            const expected = ['travian-attack-alert.user.js','travian-attack-alert.user.js.sha256'].sort();
            const names = release.assets.map((asset) => asset.name);
            if (new Set(names).size !== names.length) { console.error('RELEASE PUBLISH FAIL: draft-asset-set-mismatch: duplicate asset names'); process.exit(1); }
            if (JSON.stringify([...names].sort()) !== JSON.stringify(expected)) { console.error('RELEASE PUBLISH FAIL: draft-asset-set-mismatch: asset set is not exactly the two declared assets'); process.exit(1); }
            for (const asset of release.assets) {
              if (!Number.isInteger(asset.id) || !Number.isInteger(asset.size) || typeof asset.digest !== 'string' || asset.digest === '') { console.error('RELEASE PUBLISH FAIL: draft-asset-metadata-invalid: ' + asset.name); process.exit(1); }
            }
            const fingerprint = (assets) => JSON.stringify(assets.map((asset) => ({ id: asset.id, name: asset.name, size: asset.size, digest: asset.digest })).sort((a, b) => a.name.localeCompare(b.name)));
            if (fingerprint(listed.assets) !== fingerprint(release.assets)) { console.error('RELEASE PUBLISH FAIL: draft-asset-set-mismatch: draft metadata changed after download'); process.exit(1); }
            const record = {
              schemaVersion: 1,
              draftReleaseId: release.id,
              tag: release.tag_name,
              isDraft: release.draft,
              updatedAt: release.updated_at,
              assetIds: release.assets.map((asset) => ({ id: asset.id, name: asset.name, digest: asset.digest, size: asset.size })),
              workflowRunId: process.env.RUN_ID,
              artifactId: process.env.ARTIFACT_ID,
              artifactDigest: process.env.ARTIFACT_DIGEST,
              attestationId: process.env.ATTESTATION_ID
            };
            fs.writeFileSync('preflight/publish-record.json', JSON.stringify(record, null, 2) + '\n');
          "

      - name: Publish the verified draft (the only mutation)
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
          RELEASE_ID: ${{ needs.release-draft.outputs.release-id }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/releases/$RELEASE_ID" > preflight/release-recheck.json
          node -e "
            const fs = require('fs');
            const record = JSON.parse(fs.readFileSync('preflight/publish-record.json', 'utf8'));
            const recheck = JSON.parse(fs.readFileSync('preflight/release-recheck.json', 'utf8'));
            const expected = ['travian-attack-alert.user.js','travian-attack-alert.user.js.sha256'].sort();
            function fail(message) { console.error('RELEASE PUBLISH FAIL: draft-drift-before-publish: ' + message); process.exit(1); }
            if (recheck.draft !== true) fail('the draft is no longer a draft');
            if (recheck.id !== record.draftReleaseId) fail('the draft release id changed');
            if (recheck.tag_name !== record.tag) fail('the draft tag changed');
            const names = recheck.assets.map((asset) => asset.name);
            if (new Set(names).size !== names.length) fail('duplicate asset names appeared in the draft');
            if (JSON.stringify([...names].sort()) !== JSON.stringify(expected)) fail('the draft asset set is not exactly the two declared assets');
            const fingerprint = (assets) => JSON.stringify(assets.map((asset) => ({ id: asset.id, name: asset.name, size: asset.size, digest: asset.digest })).sort((a, b) => a.name.localeCompare(b.name)));
            if (fingerprint(recheck.assets) !== fingerprint(record.assetIds)) fail('asset ids, names, sizes or digests changed');
            console.log('RELEASE PUBLISH DRAFT STABLE: no drift between verification and mutation');
          "
          release_id=$(node -e "console.log(require('./preflight/publish-record.json').draftReleaseId)")
          gh api --method PATCH "repos/$REPO/releases/$release_id" -f draft=false > preflight/release-after.json

      - name: Verify the published immutable release and asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-build.outputs.source-tag }}
          SOURCE_SHA: ${{ needs.release-build.outputs.source-sha }}
        run: |
          set -euo pipefail
          for name in travian-attack-alert.user.js travian-attack-alert.user.js.sha256; do
            gh attestation verify "preflight/workflow-artifact/$name" -R "$REPO" >/dev/null || { echo "RELEASE PUBLISH FAIL: post-publish attestation verification failed for $name"; exit 1; }
          done
          gh release view "$TAG" --json isImmutable --jq '.isImmutable' | grep -qx true || { echo "RELEASE PUBLISH FAIL: published release is not immutable"; exit 1; }
          tag_object_after=$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')
          tag_commit_after=$(gh api "repos/$REPO/git/tags/$tag_object_after" --jq '.object.sha')
          test "$tag_commit_after" = "$SOURCE_SHA" || { echo "RELEASE PUBLISH FAIL: tag-target-changed-after-publish (incident): $TAG now points at $tag_commit_after, expected $SOURCE_SHA; never report success"; exit 1; }
          gh api "repos/$REPO/releases/tags/$TAG" > preflight/release-final.json
          node -e "
            const fs = require('fs');
            const before = JSON.parse(fs.readFileSync('preflight/publish-record.json', 'utf8'));
            const after = JSON.parse(fs.readFileSync('preflight/release-final.json', 'utf8'));
            if (after.draft !== false) { console.error('RELEASE PUBLISH FAIL: release is still a draft'); process.exit(1); }
            const ids = (list) => list.map((asset) => asset.id).sort().join(',');
            if (ids(before.assetIds) !== ids(after.assets)) { console.error('RELEASE PUBLISH FAIL: asset ids changed after publish'); process.exit(1); }
            const digests = (list) => JSON.stringify(list.map((asset) => ({ name: asset.name, digest: asset.digest })).sort((a, b) => a.name.localeCompare(b.name)));
            if (digests(before.assetIds) !== digests(after.assets)) { console.error('RELEASE PUBLISH FAIL: asset digests changed after publish'); process.exit(1); }
            console.log('RELEASE PUBLISH VERIFIED: ' + after.tag_name);
          "
