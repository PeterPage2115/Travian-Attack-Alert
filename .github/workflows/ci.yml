name: CI

on:
  pull_request:
    branches: [release/public-1.0.0]
  push:
    branches: [release/public-1.0.0]

# Read-only CI: verify and upload evidence, never publish or release.
permissions:
  contents: read

# Every action is pinned to the immutable commit of its newest stable release
# (resolved through the GitHub API in Task 26; the moving `v4` ref of each
# repository pointed at the same commit when pinned). Job timeouts are bounded
# but deliberately >= 2x the longest observed run so a timeout can never cancel
# the always()-gated evidence steps of the browser job.
jobs:
  offline-node-18:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 18
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 18
          cache: npm

      - name: Install (locked dependencies)
        run: npm ci

      # Generated files (dist/*.user.js, metadata.json, module-manifest.json)
      # are build outputs, so the deterministic build must run first.
      - name: Build generated artifacts
        run: npm run build

      - name: Offline unit gates
        run: npm run test:offline

      - name: Tools gates
        run: npm run test:tools

      - name: Artifact gates
        run: npm run test:artifact

      # Receipt-backed accounting: every manifest-owned characterization suite
      # must execute and leave a HEAD-bound receipt before the inventory gate
      # (npm run check) consumes test-results/suite-receipts. Registration in
      # the manifest alone is not execution proof.
      - name: Characterization receipts (blocking)
        run: npm run test:characterization

      - name: Checks (versions, artifact, inventory)
        run: npm run check

      - name: Type gate (blocking; Todo-6 ratchet vs type-error-baseline.json)
        run: npm run check:types

      - name: Quality gate (blocking; Todo-6 ratchet vs quality-baseline.json)
        run: npm run quality

      - name: Privacy / secrets scan
        run: |
          # The auditor forbids node_modules/, backups/, test-results/, .omo/
          # in the public copy (denylist covers the tree as committed, i.e.
          # before `npm ci`). Remove transient dirs before scanning.
          rm -rf node_modules backups test-results .omo
          node tools/audit-public-tree.cjs --root . --baseline . --out test-results/privacy-scan.json
          node -e "const r=require('./test-results/privacy-scan.json'); if(r.verdict!=='PASS'){console.error(JSON.stringify(r,null,2));process.exit(1);} console.log('privacy scan verdict: PASS');"
          # Single-source secret shapes: no duplicated grep regexes — the
          # policy lives in tools/audit-public-tree.cjs (--mode secrets).
          node tools/audit-public-tree.cjs --mode secrets --root . --out test-results/secret-scan.json
          node -e "const r=require('./test-results/secret-scan.json'); if(r.verdict!=='PASS'){console.error(JSON.stringify(r.secretHits,null,2));process.exit(1);} console.log('secret pattern scan: clean');"

      - name: Upload determinism bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: determinism-node-18
          path: |
            dist/travian-attack-alert.user.js
            dist/travian-attack-alert.user.js.sha256
            metadata.json
            module-manifest.json
          if-no-files-found: error
          retention-days: 14

  offline-node-20:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install (locked dependencies)
        run: npm ci

      - name: Build generated artifacts
        run: npm run build

      - name: Offline unit gates
        run: npm run test:offline

      - name: Tools gates
        run: npm run test:tools

      - name: Artifact gates
        run: npm run test:artifact

      # Receipt-backed accounting: every manifest-owned characterization suite
      # must execute and leave a HEAD-bound receipt before the inventory gate
      # (npm run check) consumes test-results/suite-receipts. Registration in
      # the manifest alone is not execution proof.
      - name: Characterization receipts (blocking)
        run: npm run test:characterization

      - name: Checks (versions, artifact, inventory)
        run: npm run check

      - name: Type gate (blocking; Todo-6 ratchet vs type-error-baseline.json)
        run: npm run check:types

      - name: Quality gate (blocking; Todo-6 ratchet vs quality-baseline.json)
        run: npm run quality

      - name: Privacy / secrets scan
        run: |
          rm -rf node_modules backups test-results .omo
          node tools/audit-public-tree.cjs --root . --baseline . --out test-results/privacy-scan.json
          node -e "const r=require('./test-results/privacy-scan.json'); if(r.verdict!=='PASS'){console.error(JSON.stringify(r,null,2));process.exit(1);} console.log('privacy scan verdict: PASS');"
          # Single-source secret shapes: no duplicated grep regexes — the
          # policy lives in tools/audit-public-tree.cjs (--mode secrets).
          node tools/audit-public-tree.cjs --mode secrets --root . --out test-results/secret-scan.json
          node -e "const r=require('./test-results/secret-scan.json'); if(r.verdict!=='PASS'){console.error(JSON.stringify(r.secretHits,null,2));process.exit(1);} console.log('secret pattern scan: clean');"

      - name: Upload determinism bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: determinism-node-20
          path: |
            dist/travian-attack-alert.user.js
            dist/travian-attack-alert.user.js.sha256
            metadata.json
            module-manifest.json
          if-no-files-found: error
          retention-days: 14

  # Development-major leg (Task 34): the documented development major
  # (`.node-version` = 22.19.0) runs the offline release gate exactly once
  # in CI with the documented runtime-selection flag `--no-browser`
  # (Task 12). The gate rebuilds the generated artifacts itself and executes
  # every build/versions/artifact/offline/characterization/inventory/format/
  # tool/type/quality category here; the browser-tests/e2e family executes
  # exactly once in `browser-node-20`, which is its single CI executor. The
  # steps listed below are only what the gate cannot perform for itself:
  # the locked dependency install and the Playwright Chromium download.
  #
  # Engineering decision (Task 12, design Task 11): Node-22 e2e coverage is
  # de-duplicated, not dropped — browser-node-20 already runs the identical
  # `npm run test:browser` + `npm run test:e2e` commands (Task 5 measured
  # both legs at ~17m25s of the same e2e per run). Falsifier: "no test or
  # required check consumes the Node-22 e2e result" — held under the T11
  # search (no needs:/outputs:/artifact/summary consumer of offline-node-22
  # exists; its tests pin job existence/shape only). If any such consumer
  # appears later, remove `--no-browser` here to restore Node-22 e2e.
  #
  # Timeout arithmetic (worst-case valid run WITH the full gate, i.e.
  # without `--no-browser`): the release gate gives every e2e spec its own
  # 480 s ceiling (never lowered), and discovery finds 12 specs, so
  # 12 x 480 s = 5,760 s = 96 min of legitimate e2e time alone. Add
  # `npm ci`, the `--with-deps` Chromium install, and the 14 non-e2e gates
  # inside the gate: the previous revision of this job, which additionally
  # re-ran most of those gates by hand, completed in 19m19s. 96 min + 30 min
  # overhead = 126 min, bounded at 150 min so a slow-but-valid run always
  # writes its summary instead of being cancelled before it can report.
  # The 150-minute ceiling is retained deliberately with `--no-browser`:
  # the developer-workflow contract computes this envelope from the spec
  # count on disk and ignores runtime flags (it must stay >= 126 min), and
  # a timeout is a ceiling, not a cost — with the flag this job executes
  # only the 13 non-browser gates.
  #
  # This job is informational: the four required status checks and the
  # branch-protection settings are unchanged until the owner separately
  # updates them.
  offline-node-22:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install (locked dependencies)
        run: npm ci

      # Playwright browser cache (Task 12): keyed by package.json playwright
      # version (1.55.1; keep this literal in sync when bumping playwright /
      # @playwright/test) plus the runner OS, so a Playwright bump
      # invalidates the cache. The action itself is SHA-pinned to its
      # release commit like every other action.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.55.1

      # Chromium is still installed here even though `--no-browser` excludes
      # the browser gates from this job: `npx playwright install --with-deps
      # chromium` is a hard-pinned ordered requiredRun of the
      # developer-workflow/workflow-security contracts (Task 34; kept per the
      # Task 11 default variant — zero test churn, seconds-scale cost — and it
      # warms the browser cache above). There is no NOT_EXECUTED verdict: a
      # gate that cannot execute fails this job instead of being reclassified
      # as skipped.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Single invocation of the release gate with the documented runtime-
      # selection flag `--no-browser` (Task 12): build, versions, syntax,
      # artifact matrix, offline, characterization receipts, inventory,
      # static format, tools, type and quality execute here; browser and e2e
      # are excluded from execution in this job and run exactly once in
      # `browser-node-20` (their duplicate here was ~17m25s per run, T5).
      # No gate category is run by hand above: duplicates cannot drift.
      - name: Offline release gate (blocking; complete gate matrix)
        run: npm run check:release -- --offline --no-browser

  browser-node-20:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install (locked dependencies)
        run: npm ci

      - name: Build generated artifacts
        run: npm run build

      # Playwright browser cache (Task 12): same version-pinned key as the
      # offline-node-22 leg; this job is the single executor of the
      # browser/e2e family and benefits most from the warm cache.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-1.55.1

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser integration gates
        run: npm run test:browser

      - name: Loopback e2e gates
        timeout-minutes: 20
        run: npm run test:e2e

      # Evidence pipeline: seal the complete test-results/ tree into ONE
      # deterministic ZIP outside the mutable directory, scan that exact
      # archive with the ZIP-recursive evidence scanner (while the pinned
      # decoder dependencies are installed), then recheck the sealed digest.
      # `if: always()` captures evidence even when the browser tests fail; the
      # failed test steps still decide the job status.
      - name: Seal browser evidence
        id: evidence-seal
        if: always()
        run: node tools/seal-evidence.cjs --input test-results --archive ci-evidence/upload/browser-evidence.zip --manifest ci-evidence/browser-evidence.manifest.json

      - name: Scan sealed browser evidence (blocking)
        id: evidence-scan
        if: always()
        run: node tools/audit-public-tree.cjs --mode evidence --root ci-evidence/upload --out ci-evidence/browser-evidence.scan.json

      # Immediately before upload, recompute and compare the ZIP SHA-256
      # against the seal manifest: a changed or missing digest makes the
      # upload ineligible.
      - name: Recheck sealed evidence digest
        id: evidence-digest
        if: always()
        run: node tools/seal-evidence.cjs --verify --archive ci-evidence/upload/browser-evidence.zip --manifest ci-evidence/browser-evidence.manifest.json

      # Upload ONLY the exact sealed ZIP bytes + the separate scan report,
      # never the mutable test-results/ directory. Upload stays ineligible
      # unless the seal, the evidence scan, and the digest recheck succeeded.
      - name: Upload sealed browser evidence
        if: always() && steps.evidence-seal.outcome == 'success' && steps.evidence-scan.outcome == 'success' && steps.evidence-digest.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-node-20-evidence
          path: |
            ci-evidence/upload/browser-evidence.zip
            ci-evidence/browser-evidence.scan.json
          if-no-files-found: error
          retention-days: 14

  cross-node-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [offline-node-18, offline-node-20]
    steps:
      - name: Download determinism-node-18
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: determinism-node-18
          path: determinism-node-18

      - name: Download determinism-node-20
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: determinism-node-20
          path: determinism-node-20

      - name: Byte-compare all four outputs across Node majors
        run: |
          for f in travian-attack-alert.user.js travian-attack-alert.user.js.sha256 metadata.json module-manifest.json; do
            if [ "$f" = "travian-attack-alert.user.js" ] || [ "$f" = "travian-attack-alert.user.js.sha256" ]; then
              a="determinism-node-18/dist/$f"; b="determinism-node-20/dist/$f"
            else
              a="determinism-node-18/$f"; b="determinism-node-20/$f"
            fi
            # Artifacts upload with directory prefixes stripped when a single
            # file matches; accept both layouts.
            [ -f "$a" ] || a="determinism-node-18/$f"
            [ -f "$b" ] || b="determinism-node-20/$f"
            cmp "$a" "$b" && echo "identical: $f"
          done

      - name: Write canonical ci-identity record
        env:
          WORKFLOW_PATH: .github/workflows/ci.yml
        run: |
          cat > /tmp/ci-identity.cjs <<'EOF'
          'use strict';
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const isPullRequest = process.env.GITHUB_EVENT_NAME === 'pull_request';
          const files = [
            'travian-attack-alert.user.js',
            'travian-attack-alert.user.js.sha256',
            'metadata.json',
            'module-manifest.json',
          ];
          function locate(dir, name) {
            const prefixed = name.startsWith('travian-') ? `dist/${name}` : name;
            for (const candidate of [`${dir}/${prefixed}`, `${dir}/${name}`]) {
              if (fs.existsSync(candidate)) return candidate;
            }
            throw new Error(`ci-identity: missing artifact file ${dir}/${name}`);
          }
          const perFile = {};
          for (const name of files) {
            perFile[name] = crypto.createHash('sha256').update(fs.readFileSync(locate('determinism-node-18', name))).digest('hex');
          }
          const artifactSha256 = crypto.createHash('sha256').update(files.map((name) => `${name}:${perFile[name]}`).join('\n')).digest('hex');
          const record = {
            schemaVersion: 1,
            workflowPath: process.env.WORKFLOW_PATH,
            workflowRef: process.env.GITHUB_REF,
            event: process.env.GITHUB_EVENT_NAME,
            sha: process.env.GITHUB_SHA,
            baseSha: isPullRequest ? event?.pull_request?.base?.sha ?? null : null,
            headSha: isPullRequest ? event?.pull_request?.head?.sha ?? null : null,
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            repository: process.env.GITHUB_REPOSITORY,
            artifactSha256,
            artifacts: perFile,
          };
          fs.mkdirSync('ci-identity', { recursive: true });
          fs.writeFileSync('ci-identity/ci-identity.json', `${JSON.stringify(record, null, 2)}\n`);
          console.log(JSON.stringify(record, null, 2));
          EOF
          node /tmp/ci-identity.cjs

      - name: Upload ci-identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-identity
          path: ci-identity/ci-identity.json
          if-no-files-found: error
          retention-days: 14
